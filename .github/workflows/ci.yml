name: "CI"
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version:
          - 22.x
          - 24.x
          - 26.x
    steps:
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Load cache
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-test-modules-v1-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Build project
        run: yarn run build
      - name: Run tests
        run: yarn run test-ci
      - name: Submit coverage results
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: run-${{ matrix.node-version }}
          parallel: true
      - name: Run external RDF manifest tests
        # Local real-COTTAS integration tests run above. Enable this only after a hosted manifest is published.
        if: ${{ false }}
        run: npx lerna run integration --concurrency 1

  coveralls:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Consolidate test coverage from different jobs
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Load cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-lint-modules-v1-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Run linter
        run: yarn run lint
      - name: Validate benchmark configurations and result checks
        run: yarn run test-performance

  docker:
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Load cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-docker-modules-v1-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Install Lerna Docker
        run: sh -c "`curl -fsSl https://raw.githubusercontent.com/rubensworks/lerna-docker/master/install.sh`"
      - name: Build Docker images
        run: ~/.lerna-docker/bin/lerna-docker comunica build
      - name: Deploy Docker images
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/')
        run: ~/.lerna-docker/bin/lerna-docker comunica push
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - watdiv-cottas
          - watdiv-cottas-100
          - bsbm-cottas
          - bsbm-cottas-10k
    needs:
      - test
      - lint
    env:
      BENCHMARK_BASE: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: head
      - name: Check out the base commit of the pull request
        if: env.BENCHMARK_BASE == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Use the same benchmark harness for both engines
        if: env.BENCHMARK_BASE == 'true'
        # The base may predate these benchmarks or their COTTAS preparation scripts.
        run: |
          cp -R head/performance/. base/performance/
          node <<'NODE'
          const fs = require('node:fs');
          const base = JSON.parse(fs.readFileSync('base/package.json', 'utf8'));
          const head = JSON.parse(fs.readFileSync('head/package.json', 'utf8'));
          const dependency = '**/sparql-benchmark-runner/fetch-sparql-endpoint';
          base.resolutions = { ...base.resolutions, [dependency]: head.resolutions[dependency] };
          fs.writeFileSync('base/package.json', JSON.stringify(base, null, 2) + '\n');
          NODE
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
        working-directory: head
      - name: Install dependencies of the base commit
        if: env.BENCHMARK_BASE == 'true'
        # Preserve its lockfile while allowing the pinned benchmark-client fix above.
        run: yarn install --ignore-engines
        working-directory: base
      - name: Prepare RDF inputs, queries, and COTTAS files
        run: yarn run performance:prepare
        working-directory: head/performance/benchmark-${{ matrix.benchmark }}
      - name: Share the prepared inputs with the base commit
        if: env.BENCHMARK_BASE == 'true'
        run: cp -R head/performance/benchmark-${{ matrix.benchmark }}/generated/. base/performance/benchmark-${{ matrix.benchmark }}/generated/
      - name: Prepare the base benchmark runner
        if: env.BENCHMARK_BASE == 'true'
        # JBR creates the runner log directories and reuses the shared RDF inputs.
        run: yarn run jbr prepare -c 0
        working-directory: base/performance/benchmark-${{ matrix.benchmark }}
      - name: Run benchmarks of the base commit
        if: env.BENCHMARK_BASE == 'true'
        run: yarn run performance:run
        working-directory: base/performance/benchmark-${{ matrix.benchmark }}
      - name: Remove containers left behind by the base commit benchmarks
        if: env.BENCHMARK_BASE == 'true'
        run: docker ps -aq | xargs -r docker rm -f
      - name: Run benchmarks
        run: yarn run performance:run
        working-directory: head/performance/benchmark-${{ matrix.benchmark }}
      - name: Record COTTAS provenance with the results
        if: always()
        run: |
          for checkout in head base; do
            benchmark="$checkout/performance/benchmark-${{ matrix.benchmark }}"
            if [ -f "$benchmark/generated/dataset.cottas.json" ]; then
              cp "$benchmark/generated/dataset.cottas.json" "$benchmark/combinations/combination_0/output/"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-benchmark-${{ matrix.benchmark }}
          path: head/performance/benchmark-${{ matrix.benchmark }}/combinations/combination_0/output/
      - uses: actions/upload-artifact@v7
        if: always() && env.BENCHMARK_BASE == 'true'
        with:
          name: performance-benchmark-base-${{ matrix.benchmark }}
          path: base/performance/benchmark-${{ matrix.benchmark }}/combinations/combination_0/output/

  performance-consolidate:
    needs:
      - performance
    runs-on: ubuntu-latest
    env:
      # Historical publishing uses the existing PAT only; comparisons require no write permissions.
      BENCHMARK_PUBLISH_ENABLED: ${{ secrets.PAT != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install result-processing dependencies
        run: yarn install --frozen-lockfile --ignore-engines --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: performance-benchmark-*
          path: artifacts
      - name: Summarize benchmarks
        if: github.event_name != 'pull_request'
        run: node performance/scripts/summarize-results.js artifacts
      - name: Compare pull request benchmarks against the base commit
        if: github.event_name == 'pull_request'
        run: node performance/scripts/summarize-results.js artifacts --compare
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: |
            ghbench-*.json
            benchmark-summary.md
      - name: Determine benchmark results target directories
        run: |
          echo "BENCHMARK_DATA_DIR_PATH_DETAIL=comunica-feature-cottas/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}/benchmarks-detail" >> "$GITHUB_ENV"
          echo "BENCHMARK_DATA_DIR_PATH_TOTAL=comunica-feature-cottas/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}/benchmarks-total" >> "$GITHUB_ENV"
      - name: Finalize benchmarks detailed results
        if: env.BENCHMARK_PUBLISH_ENABLED == 'true' && github.repository == 'comunica/comunica-feature-cottas' && (startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/feature') || startsWith(github.ref, 'refs/heads/next'))
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmarks detailed results
          tool: 'customSmallerIsBetter'
          output-file-path: ghbench-detail.json
          github-token: ${{ secrets.PAT }}
          auto-push: true
          alert-comment-cc-users: '@rubensworks'
          gh-repository: 'github.com/comunica/comunica-performance-results'
          gh-pages-branch: 'master'
          benchmark-data-dir-path: ${{ env.BENCHMARK_DATA_DIR_PATH_DETAIL }}
      - name: Cleanup benchmark-action data
        run: rm -rf ./benchmark-data-repository
      - name: Finalize benchmarks total results
        if: env.BENCHMARK_PUBLISH_ENABLED == 'true' && github.repository == 'comunica/comunica-feature-cottas' && (startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/feature') || startsWith(github.ref, 'refs/heads/next'))
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmarks total results
          tool: 'customSmallerIsBetter'
          output-file-path: ghbench-total.json
          github-token: ${{ secrets.PAT }}
          auto-push: true
          alert-threshold: '150%'
          comment-always: true
          comment-on-alert: true
          alert-comment-cc-users: '@rubensworks'
          fail-on-alert: true
          summary-always: true
          gh-repository: 'github.com/comunica/comunica-performance-results'
          gh-pages-branch: 'master'
          benchmark-data-dir-path: ${{ env.BENCHMARK_DATA_DIR_PATH_TOTAL }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Load cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-docs-modules-v1-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Build docs
        run: yarn run doc
      - name: Deploy TSDoc to GitHub Pages
        if: startsWith(github.ref, 'refs/heads/master')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: documentation
          clean: true
